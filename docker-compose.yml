# ===================================================
# Moss Nexus - Docker Compose Configuration
# Qdrant Vector Database 로컬 실행을 위한 설정
# ===================================================
# 보안 기본값:
# - 루프백(127.0.0.1)에만 바인드 — LAN에 노출되지 않음
# - gRPC 포트(6334)는 사용하지 않으므로 공개하지 않음
# - 이미지 버전 고정 (재현 가능한 설치)

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: moss_nexus_qdrant
    restart: unless-stopped
    ports:
      # REST API 포트 — 로컬호스트 전용
      - "127.0.0.1:6333:6333"
    volumes:
      # 데이터 영속성을 위한 볼륨 마운트
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      # 성능 최적화 설정
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: moss_nexus_network
