# ===================================================
# Moss Nexus - Project Configuration
# ===================================================

[project]
name = "moss-nexus"
version = "2.0.0"
description = "Mossland local-first knowledge & evidence node - local hybrid RAG over versioned official documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Vector DB
    "qdrant-client>=1.12,<2",
    # Embeddings (BGE-M3 dense + sparse)
    "FlagEmbedding>=1.3.4,<2",
    "torch>=2.5",
    # LLM serving (Ollama)
    "ollama>=0.4,<1",
    # Document loaders
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    # Backend API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Discord bot
    "discord.py>=2.4,<3",
    # Utilities
    "python-dotenv>=1.0,<2",
    "tqdm>=4.66,<5",
    "loguru>=0.7,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
]

[tool.uv]
# 앱 프로젝트 — 패키지 빌드/설치 없이 의존성만 관리
package = false

# Linux는 CPU 전용 PyTorch 휠 사용 (CUDA 툴킷 수 GB 다운로드 방지).
# Linux + NVIDIA GPU에서 CUDA를 쓰려면 아래 sources 블록을 제거하고 다시 `uv lock` 하세요.
# macOS는 기본 휠(MPS 지원)을 그대로 사용합니다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
